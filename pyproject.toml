[build-system]
requires = [
    "hatchling>=1.18.0",
    "Cython>=3",
    "wheel>=0.37.0",
]
build-backend = "hatchling.build"

[project]
name = "hb-strategy-framework"
description = "Strategy framework for Hummingbot trading strategies"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [
    {name = "Memento RC Mori", email = "claude.rc@gmail.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Cython",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "pydantic>=2",
]
dynamic = ["version"]

[project.urls]
Homepage = "https://github.com/MementoRC/hb-strategy-framework"
Documentation = "https://mementorc.github.io/hb-strategy-framework"
Repository = "https://github.com/MementoRC/hb-strategy-framework/tree/master"

[project.optional-dependencies]
dev = [
    "docformatter>=1.4.3",
    "pre-commit>=2.15.0",
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "pytest-cov>=4.1.0",
    "pytest-mock>=3.11.0",
    "pytest-timeout>=2.1.0",
    "pytest-benchmark>=4.0.0",
    "pyupgrade",
    "ruff>=0.1.5",
    "mypy>=1.5.1",
    "cython-lint>=0.15.0",
]
doc = [
    "mkdocs>=1.3.0",
    "mkdocs-git-revision-date-localized-plugin",
    "mkdocs-material>=8.2.0",
    "mkdocstrings-python",
    "mkdocstrings>=0.18.0",
    "pymdown-extensions>=8.0.0",
]
hummingbot = []

[tool.hatch.version]
path = "strategy_framework/__about__.py"

# Hatch configuration for conda environments
[tool.hatch.env]
requires = ["hatch-conda>=0.5.2"]
type = "conda"

# Documentation environment
[tool.hatch.envs.docs]
conda-channels = ["conda-forge", "defaults"]
features = ["doc"]
dependencies = []

[tool.hatch.envs.docs.scripts]
build = "mkdocs build --clean --strict"
serve = "mkdocs serve --dev-addr localhost:8008"
deploy = "mkdocs gh-deploy"

# CI environment
[tool.hatch.envs.CI]
conda-channels = ["conda-forge", "defaults"]
features = ["dev"]
dependencies = [
    "types-setuptools",
]

[tool.hatch.envs.CI.scripts]
check = "ruff check strategy_framework tests; ruff format --check strategy_framework tests"
hints = "mypy --install-types --non-interactive --ignore-missing-imports strategy_framework/"

# Default environment
[tool.hatch.envs.default]
conda-channels = ["conda-forge", "defaults"]
features = ["dev"]
dependencies = []

# Pip dependencies with --no-deps flag
[tool.hatch.envs.default.pip-no-deps]
dependencies = []

# Scripts for the default environment
[tool.hatch.envs.default.scripts]
test = "pytest {args:tests}"
test-unit = "pytest tests/unit"
test-integration = "pytest tests/integration"
lint = "ruff check strategy_framework tests"
format = "ruff format strategy_framework tests"
typecheck = "mypy strategy_framework"
lint-cython = "cython-lint strategy_framework"
check = ["format", "lint", "typecheck", "test"]

# Hatch build configuration with Cython integration via custom hook
[tool.hatch.build.targets.wheel]
packages = ["strategy_framework"]
build-hook = "setup-tools.hatch-hooks.cython_build_hook"

# Distribution package configuration
[tool.hatch.build.targets.sdist]
include = [
    "strategy_framework/**/*.py",
    "strategy_framework/**/*.pyx",
    "strategy_framework/**/*.pxd",
    "docs/**/*.md",
    "docs/**/*.yml",
    "setup-tools/**/*",
    "LICENSE",
    "README.md",
    "pyproject.toml",
]
exclude = [
    "build",
    "dist",
    "**/__pycache__",
    "**/*.pyc",
    ".git",
    ".github",
    "**/.pytest_cache",
    "**/.mypy_cache",
    "**/.DS_Store",
    "**/*.so",
    "**/*.dylib",
]

# ─── Pixi Configuration ───────────────────────────────────────────────────────

[tool.pixi.project]
channels = ["conda-forge"]
platforms = ["linux-64", "osx-arm64", "osx-64", "win-64"]

[tool.pixi.dependencies]
python = ">=3.10"
hatchling = ">=1.18.0"
pydantic = ">=2"

[tool.pixi.feature.test.dependencies]
pytest = ">=7.0.0"
pytest-asyncio = ">=0.21.0"
pytest-cov = ">=4.1.0"
pytest-mock = ">=3.11.0"
pytest-timeout = ">=2.1.0"
pytest-benchmark = ">=4.0.0"

[tool.pixi.feature.quality.dependencies]
ruff = ">=0.1.5"
mypy = ">=1.5.1"
pre-commit = ">=2.15.0"

[tool.pixi.feature.docs.dependencies]
mkdocs = ">=1.3.0"
mkdocs-material = ">=8.2.0"

[tool.pixi.environments]
default = {features = ["test", "quality"], solve-group = "default"}
docs = {features = ["docs"], solve-group = "default"}
ci = {features = ["test", "quality"], solve-group = "default"}
py310 = ["test", "quality"]
py311 = ["test", "quality"]
py312 = ["test", "quality"]

[tool.pixi.tasks]
test = "pytest tests"
test-unit = "pytest tests/unit"
test-integration = "pytest tests/integration"
lint = "ruff check strategy_framework tests"
format = "ruff format strategy_framework tests"
format-check = "ruff format --check strategy_framework tests"
typecheck = "mypy strategy_framework"
security = "bandit -c pyproject.toml -r strategy_framework/"
quality = {depends-on = ["lint", "typecheck"]}
check = {depends-on = ["format", "lint", "typecheck", "test"]}
docs-build = "mkdocs build --clean"
docs-serve = "mkdocs serve --dev-addr localhost:8008"

# ─── Tool Configuration ───────────────────────────────────────────────────────

# Coverage configuration
[tool.coverage.run]
branch = true
parallel = true
source_pkgs = ["strategy_framework", "tests"]
omit = [
    "strategy_framework/__about__.py",
]

[tool.coverage.report]
fail_under = 0
show_missing = true
skip_covered = true
skip_empty = true
exclude_lines = [
    "no cov",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
    "raise NotImplementedError",
]

# Ruff configuration
[tool.ruff]
target-version = "py310"
line-length = 100

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "auto"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "F",   # pyflakes
    "I",   # isort
    "W",   # pycodestyle warnings
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "N",   # pep8-naming
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
]
ignore = [
    "E203",  # whitespace before ':'
    "E501",  # line too long - handled by formatter
    "F401",  # unused imports - we'll address these gradually
]
unfixable = ["F401"]

[tool.ruff.lint.isort]
known-first-party = ["strategy_framework"]

[tool.ruff.lint.flake8-quotes]
docstring-quotes = "double"

# Pytest configuration
[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
python_files = "test_*.py"
python_functions = "test_*"
timeout = 300
addopts = "--strict-markers --strict-config"
markers = [
    "unit: marks tests as unit tests",
    "integration: marks tests as integration tests (deselect with '-m \"not integration\"')",
    "e2e: marks tests as end-to-end tests",
    "asyncio: marks tests as asyncio tests",
    "benchmark: marks tests as benchmark tests",
    "live: marks tests as live API tests (require credentials)",
]
log_cli = true
log_cli_level = "INFO"

# MyPy configuration
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
check_untyped_defs = true
disallow_untyped_defs = false
exclude = [
    "strategy_framework/mocking_resources/.*",
]

# Bandit configuration
[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]

# ─── Hummingbot Supersession Metadata ─────────────────────────────────────────

[tool.hummingbot.supersedes]
module = "hummingbot.strategy"
import_path = "strategy_framework.hb_compat"
factory_class = "StrategyFactory"
config_class = "StrategyConfig"
test_paths = ["test/hummingbot/strategy"]
