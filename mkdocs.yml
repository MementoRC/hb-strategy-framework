site_name: hb-strategy-framework Documentation
site_description: 'Documentation for the hb-strategy-framework package'
site_author: 'Hummingbot Team'

repo_name: 'MementoRC/hb-strategy-framework'
repo_url: 'https://github.com/MementoRC/hb-strategy-framework'

docs_dir: docs
site_dir: site

exclude_docs: |
  superpowers/

theme:
  name: 'material'
  palette:
    primary: 'blue'
    accent: 'blue'
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.path
    - content.code.copy
    - content.code.annotate

markdown_extensions:
  - admonition
  - codehilite
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.highlight
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.smartsymbols
  - pymdownx.tasklist
  - pymdownx.emoji
  - toc:
      permalink: true

nav:
  - Home: index.md
  - API Reference:
    - Overview: api/index.md
    - building_blocks: api/building_blocks.md
    - config: api/config.md
    - executors: api/executors.md
    - hb_compat: api/hb_compat.md
    - linked_orders: api/linked_orders.md
    - mixins: api/mixins.md
    - orchestrator: api/orchestrator.md
    - primitives: api/primitives.md
    - protocols: api/protocols.md
    - testing: api/testing.md

extra_css:
  - stylesheets/extra.css

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [.]
          options:
            docstring_style: google
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            members_order: source
            filters:
              - "!^_"
            merge_init_into_class: true
  - git-revision-date-localized:
      fallback_to_build_date: true
